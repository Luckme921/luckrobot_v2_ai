# Small brain user service drop-in. DDS must start after the wired address exists.
# Install as ~/.config/systemd/user/luckrobot-supervisor.service.d/network.conf
[Service]
ExecStartPre=/bin/bash -c 'for attempt in {1..60}; do ip -4 -o addr show dev enP8p1s0 | grep -q " 10.0.0.51/" && test "$(cat /sys/class/net/enP8p1s0/carrier)" = 1 && exit 0; sleep 1; done; exit 1'
