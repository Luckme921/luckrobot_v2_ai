agent:
  provider: zhipu
  model: glm-5.3-flash
  base_url: "https://open.bigmodel.cn/api/paas/v4/"
  timeout_seconds: 30
  max_retries: 2
  temperature: 0.4
  max_tokens: 2048
  route_protocol: "json"  # Set to tool to restore legacy routing.
  thinking: "enabled"
  reasoning_effort: "low"
  # Final answer text is streamed; route JSON remains a complete response.
  stream_text_enabled: true

web_search:
  enabled: true
  endpoint: "https://open.bigmodel.cn/api/paas/v4/web_search"
  engine: "search_std"
  count: 5
  timeout_seconds: 15
  content_size: "medium"
  max_content_chars: 700
