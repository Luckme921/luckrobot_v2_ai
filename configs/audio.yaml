audio:
  sound_direction:
    log_samples: false
    enabled: true
    interval_seconds: 1.0
    front_offset_deg: null  # Calibrate sensor angle facing robot front first.
    clockwise: true
  sample_rate: 16000
  channels: 1
  format: s16le
  reconnect_interval_seconds: 1.0
  zero_audio_timeout_seconds: 1.0
  microphone:
    input_channels: 2
    selected_channel: 1
    match_any:
    - alsa_input.usb-Seeed_Studio_reSpeaker_XVF3800_4-Mic_Array
    - reSpeaker_XVF3800_4-Mic_Array
    - Seeed_Studio_reSpeaker
    - XVF3800
  speaker:
    match_any:
    - alsa_output.usb-Seeed_Studio_reSpeaker_XVF3800_4-Mic_Array
    - reSpeaker_XVF3800_4-Mic_Array
    - Seeed_Studio_reSpeaker
    - XVF3800
display:
  enabled: true
  state_path: private/runtime/display_state.json
vad:
  model: ~/luckrobot_ai/models/vad/silero_vad.onnx
  threshold: 0.5
  min_silence_duration: 0.6
  min_speech_duration: 0.25
  max_speech_duration: 20
  buffer_size_seconds: 30
  num_threads: 1
asr:
  model_dir: ~/luckrobot_ai/models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17
  provider: cpu
  num_threads: 4
  language: zh
  use_itn: true
  context_pre_seconds: 0.3
  context_post_seconds: 0.2
interaction:
  # Prints ASR text to the main process log while diagnostics are enabled.
  debug_log_transcript: true
  conversation_log:
    enabled: true
    path: logs/conversation.log
    max_text_chars: 12000
    # Diagnostic only: never wakes the robot from an ASR transcript.
    log_sleeping_asr: true
  wake:
    barge_in_enabled: true
    # Store the user text with an interruption marker when Lucky cancels a turn.
    record_interrupted_turns: true
    enabled: true
    keyword: LUCKY
    model_dir: ~/luckrobot_ai/models/kws/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20
    tokens: tokens.txt
    encoder: encoder-epoch-13-avg-2-chunk-16-left-64.int8.onnx
    decoder: decoder-epoch-13-avg-2-chunk-16-left-64.onnx
    joiner: joiner-epoch-13-avg-2-chunk-16-left-64.int8.onnx
    keywords_file: ~/luckrobot_ai/configs/keywords_lucky.txt
    provider: cpu
    num_threads: 1
    feature_dim: 80
    max_active_paths: 4
    keywords_score: 1.0
    keywords_threshold: 0.2
    num_trailing_blanks: 1
    wake_command_timeout_seconds: 8.0
    include_pre_wake_speech: false
    transcript_aliases:
    - lucky
    - luck
    - luckake
    - 拉可
    - 拉ucky
    - 拉uckk
    - 阿k
    - l克
    - 那可
    - 那可以
    - 拉克
    - 拉uck克
    - 那uck克
    - 老uck克
    - 老克
    - 拉卡
    # Ambiguous ASR forms are aliases only for the first segment after KWS.
    # They remain ordinary words during an active conversation.
    post_kws_transcript_aliases:
    - 拉uck
    - 拉圾
    - 垃圾
    - 马蹄
    transcript_exact_aliases:
    - 拉
    - 拉克
    - 那可
    - 那可以
    - 拉uck克
    - 那uck克
    - 拉ucky
    - 老uck克
    - 老克
    - 拉客
    - 那克
    - 拉卡
    - 拉开
    - 拉y
    - 挖皮
  followup:
    normal_timeout_seconds: 12.0
    chat_timeout_seconds: 20.0
  chat_mode_triggers:
  - 陪我聊
  - 聊聊天
  - 聊会儿
  - 聊一会儿
  - 说说话
  - 陪陪我
  - 跟我聊
  sleep_phrases:
  - 结束对话
  - 结束聊天
  - 停止对话
  - 退出聊天
  - 不聊了
  - 先这样吧
  - 你休息吧
  - 休息吧
  - 不用了
  - 没事了
  - 再见
  - 拜拜
  emergency_stop_phrases:
  - 停
  - 停止
  - 停下来
  - 别动
agent_bridge:
  progress_enabled: true
  # Consume streamed answer text and send punctuation-delimited chunks to TTS.
  stream_text_to_tts: true
  enabled: true
  endpoint: http://127.0.0.1:8000/chat
  timeout_seconds: 35.0
  history_max_turns: 100
  memory_db_path: private/memory/conversation.sqlite3
  compact_batch_turns: 100
  archive_retrieval_limit: 6
music:
  enabled: true
  provider: qqmusic
  profile_path: private/qqmusic-firefox
  firefox_binary: /usr/bin/firefox
  timeout_seconds: 30.0
  prewarm: true
  headless: true
  # Keep the first QQ rollout responsive; enable after playlist refresh is timed.
  library_refresh_enabled: false
tts:
  # Prepare several streamed clauses concurrently, then play them in text order.
  stream_prefetch_workers: 3
  # After a segment ends, briefly wait for Edge before using ready Kokoro audio.
  stream_fallback_grace_seconds: 0.35
  acknowledgement_enabled: true
  acknowledgement_delay_seconds: 0.35
  dynamic_music_acknowledgement_enabled: true
  dynamic_music_acknowledgement_wait_seconds: 1.5
  enabled: true
  provider: edge
  edge_voice: zh-CN-XiaoxiaoNeural
  edge_python: private/tts-eval-venv/bin/python
  edge_first_audio_timeout_seconds: 8
  edge_idle_timeout_seconds: 10
  model_dir: ~/luckrobot_ai/models/tts/kokoro-multi-lang-v1_0
  speaker_id: 50
  num_threads: 6
  speed: 1.0
  silence_scale: 0.2
  volume_percent: 80
  post_playback_guard_seconds: 0.6
